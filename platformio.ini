; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:env]
; Pinned deliberately: 6.1.0 == ESP-IDF v5.0.1, the version README targets.
; Leaving this unpinned lets PlatformIO pull the latest, which drifts the toolchain
; and breaks the NimBLE submodule (see build_src_flags below).
platform = espressif32@6.1.0
board = firebeetle32
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 2000000
board_build.partitions = src/partition_table.csv
build_type = debug
board_upload.flash_size = "4MB"

[env]
build_flags = 
	-I app/dateTime
	-I app/wifi
	-I app/Nvs32
	-I app/imu
	-I app/ble
	-I app/ble/esp-nimble-cpp/src
	-I app/battery
	-I app/appManagement
	-I drivers/i2c
	-I drivers/gpio
	-I drivers/nvs
	-I drivers/adc
	-std=gnu++14
build_unflags = -std=gnu++11

; Legacy of esp-nimble-cpp 1.4.x, which declared time_t stubs in NimBLEAttValue.h but
; only included <time.h> when CONFIG_NIMBLE_CPP_ATT_VALUE_TIMESTAMP_ENABLED=1 (default 0).
; 2.5.0 includes <ctime> unconditionally, so this is no longer required -- kept as cheap
; insurance for a platform bump (GCC 14 does not pull time.h in transitively; GCC 11 does).
; Must be build_src_flags, NOT build_flags: the latter also hits framework C
; sources, and forcing time.h ahead of newlib's signal.h breaks its pthread.c.
build_src_flags = -include time.h
